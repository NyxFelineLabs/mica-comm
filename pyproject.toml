[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mica-comm"
version = "0.1.0"
description = "An experiment platform for communication and collaboration in heterogeneous agent teams"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "MICA contributors" }]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "pillow>=9.1",
]

[project.urls]
Homepage = "https://github.com/NyxFelineLabs/mica-comm"
Repository = "https://github.com/NyxFelineLabs/mica-comm"
Issues = "https://github.com/NyxFelineLabs/mica-comm/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "black>=24.0",
  "ruff>=0.6",
]

[project.scripts]
mica-mission = "mica_comm.simulation.simulator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]

[tool.black]
line-length = 100
target-version = ["py39"]
extend-exclude = "(results|figures|models)"

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["results", "figures", "models"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
